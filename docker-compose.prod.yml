services:
  postgres:
    image: postgres:16-alpine
    container_name: ascure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ascure}
      POSTGRES_USER: ${POSTGRES_USER:-ascure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${ASCURE_POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ascure-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: ascure-api:prod
    container_name: ascure-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      UPLOADS_DIR: /app/uploads
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env using host postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - ${ASCURE_UPLOADS_DIR:-./data/uploads}:/app/uploads
    ports:
      - "3000:3000"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ascure-net

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: ascure-admin-web:prod
    container_name: ascure-admin-web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3001"
    expose:
      - "3001"
    depends_on:
      api:
        condition: service_started
    networks:
      - ascure-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ascure-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      admin-web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ${ASCURE_UPLOADS_DIR:-./data/uploads}:/var/www/ascure/uploads:ro
    networks:
      - ascure-net

networks:
  ascure-net:
    name: ascure-net
    driver: bridge
