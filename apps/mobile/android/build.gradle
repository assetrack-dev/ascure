// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // Mapbox SDK registry (offline satellite via @rnmapbox/maps). We DON'T run
    // expo prebuild (native is hand-maintained), so the @rnmapbox/maps config
    // plugin can't add this — it's declared here manually. The SECRET download
    // token (sk.* with DOWNLOADS:READ) is NEVER committed: set it as a gradle
    // property MAPBOX_DOWNLOADS_TOKEN in ~/.gradle/gradle.properties (or -P /
    // the MAPBOX_DOWNLOADS_TOKEN env var) at build time.
    maven {
      url 'https://api.mapbox.com/downloads/v2/releases/maven'
      authentication { basic(BasicAuthentication) }
      credentials {
        username = 'mapbox'
        password = project.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?: System.getenv('MAPBOX_DOWNLOADS_TOKEN') ?: ''
      }
    }
  }
}

// --- Windows/NDK C++ STL link fix -------------------------------------------
// The NDK links shared libs with -Wl,--no-undefined but does not auto-add the
// C++ shared runtime here, so libc++ symbols (__cxa_*, operator new, std::*)
// come up undefined and the native build fails. Inject CMAKE_PROJECT_INCLUDE
// into every native build (third-party modules AND the app's generated codegen
// targets) so force-cxx-shared.cmake adds `link_libraries(c++_shared)` globally.
def cxxSharedFixFile = new File(rootDir, "force-cxx-shared.cmake").absolutePath.replace("\\", "/")
def applyCxxSharedFix = { project ->
  project.android.defaultConfig.externalNativeBuild.cmake.arguments "-DCMAKE_PROJECT_INCLUDE=${cxxSharedFixFile}"
}
subprojects { sub ->
  sub.plugins.withId("com.android.library") { applyCxxSharedFix(sub) }
  sub.plugins.withId("com.android.application") { applyCxxSharedFix(sub) }
}
// ----------------------------------------------------------------------------

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
